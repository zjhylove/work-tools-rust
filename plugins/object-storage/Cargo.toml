[package]
name = "object-storage"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worktools-plugin-api = { path = "../../shared/plugin-api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
reqwest = { version = "0.12", features = ["blocking"] }
hmac = "0.13"
sha1 = "0.11"
base64 = "0.22"
hex = "0.4"
url = "2.5"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4"] }
md5 = "0.7"

[dev-dependencies]
dirs = "5"
