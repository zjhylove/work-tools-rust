[package]
name = "work-tools"
version = "1.0.0"
description = "Work Tools Platform - Rust Edition"
authors = ["zjhy"]
edition = "2021"
default-run = "work-tools"

[lib]
name = "work_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "work-tools"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = ["codegen"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "registry"] }
tracing-appender = "0.2"
directories = "6.0.0"
libloading = "0.9.0"
parking_lot = "0.12"
zip = "8.2.0"
chrono = { version = "0.4", features = ["serde"] }
opener = "0.8.4"

# 本地依赖
worktools-shared-types = { path = "../../shared/types" }
worktools-plugin-api = { path = "../../shared/plugin-api" }

[dev-dependencies]
tempfile = "3"
